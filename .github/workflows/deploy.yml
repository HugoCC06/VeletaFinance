name: Build and deploy to GitHub Pages

# The site must be BUILT before it is served: GitHub Pages "Deploy from a branch"
# would serve the raw source index.html (a blank page). Set
# Settings → Pages → Source to "GitHub Actions" so this workflow deploys dist/.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          # Public values only — set as repository *variables*. Empty Supabase values = demo mode.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('{0}/', steps.pages.outputs.base_path) }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || format('{0}/', steps.pages.outputs.base_url) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Also publish the built site to the gh-pages branch, so Pages works with
      # "Deploy from a branch → gh-pages / (root)" as well as "GitHub Actions".
      - name: Publish built site to gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Built site from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Fails harmlessly if Pages is set to "Deploy from a branch" (gh-pages is used then).
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
