name: Build and deploy to GitHub Pages

# The site must be BUILT before it is served: GitHub Pages "Deploy from a branch"
# would serve the raw source index.html (a blank page). Set
# Settings → Pages → Source to "GitHub Actions" so this workflow deploys dist/.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          # Public values only — set as repository *variables*. Empty Supabase values = demo mode.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('{0}/', steps.pages.outputs.base_path) }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || format('{0}/', steps.pages.outputs.base_url) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
